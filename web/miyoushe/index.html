<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>米游社功能</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="login" class="login" aria-labelledby="login-title">
    <h1 id="login-title">米游社功能</h1>
    <p id="login-message" role="status">正在读取当前档案…</p>
    <code id="login-command" hidden>#米游社功能</code>
    <button id="login-retry" class="secondary" type="button" hidden>重试</button>
  </main>
  <div id="dashboard" hidden>
    <header class="topbar">
      <span class="brand">米游社功能</span>
      <div class="account">
        <span id="profile"></span>
        <button id="logout" class="text-button" type="button">退出</button>
      </div>
    </header>
    <main class="workspace">
      <section class="intro">
        <div>
          <h1 id="profile-name"></h1>
          <p id="session-expiry"></p>
        </div>
        <span class="clock">北京时间 <time id="clock"></time></span>
      </section>
      <section class="metrics" aria-label="米游币">
        <article><h2>可用米游币</h2><strong id="balance">—</strong></article>
        <article><h2>今日已领</h2><strong id="received">—</strong></article>
        <article><h2>今日任务总额</h2><strong id="today-total">—</strong></article>
      </section>
      <section class="catalog" aria-label="米游社功能">
        <header class="section-head">
          <nav class="tabs" aria-label="页面">
            <button id="tab-overview" type="button" aria-pressed="true">米游社总览</button>
            <button id="tab-shop" type="button" aria-pressed="false">商品商城</button>
            <button id="tab-plans" type="button" aria-pressed="false">兑换记录</button>
          </nav>
          <button id="refresh" class="secondary" type="button">刷新数据</button>
        </header>
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="overview-view" class="overview-view" aria-busy="false">
          <article class="overview-section">
            <h3>账号状态</h3>
            <p id="account-state"></p>
            <p id="today-schedule" class="muted" hidden></p>
            <p id="roles-empty" class="muted" hidden>暂无绑定游戏角色</p>
            <ul id="roles" class="rows" aria-label="已绑定角色"></ul>
          </article>
          <article class="overview-section">
            <h3>当前社区任务</h3>
            <p id="missions-empty" class="muted" hidden></p>
            <ul id="missions" class="rows" aria-label="任务进度"></ul>
          </article>
        </div>
        <div id="shop-view" hidden>
          <div class="shop-filters">
            <label>游戏分区<select id="shop-game"><option value="">全部商品</option></select></label>
            <label>商品状态<select id="shop-status">
              <option value="all">全部状态</option>
              <option value="scheduled">等待开放</option>
              <option value="available">正在兑换</option>
              <option value="sold_out">已兑完</option>
              <option value="ended">已结束</option>
              <option value="unknown">状态待确认</option>
            </select></label>
            <label class="shop-search">搜索商品<input id="shop-search" type="search" placeholder="搜索当前页商品"></label>
          </div>
          <p id="shop-note" class="muted" role="status"></p>
          <div id="shop-goods" class="goods-grid"></div>
          <div id="shop-pagination" class="shop-pagination" hidden>
            <button id="shop-previous" type="button" class="secondary">上一页</button>
            <span id="shop-page"></span>
            <button id="shop-next" type="button" class="secondary">下一页</button>
          </div>
        </div>
        <div id="plans-view" hidden>
          <p id="plans-note" class="muted" role="status"></p>
          <div id="shop-plans" aria-label="兑换记录"></div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="shop-detail" aria-labelledby="shop-detail-title">
    <header class="section-head">
      <h2 id="shop-detail-title">商品详情</h2>
      <button id="shop-close" type="button" class="text-button" aria-label="关闭商品详情">关闭</button>
    </header>
    <div id="shop-detail-content" aria-live="polite"></div>
  </dialog>
</body>
</html>
