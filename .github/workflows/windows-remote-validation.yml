name: Windows remote operations verification

on:
  push:
    branches:
      - codex/windows-remote-validation

permissions:
  contents: read

jobs:
  win32:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Validate Windows shell, NTFS paths, and token permissions
        shell: pwsh
        env:
          LOTUS_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          bun --version
          bun --no-env-file -e 'if (process.arch !== Bun.env.LOTUS_EXPECTED_ARCH) throw Error(process.arch)'
          Get-Command powershell.exe
          bun test test/remote-win32.test.ts
