- name: 阿基维利
  allegiance: 星神
  weapon: 开拓
  desc: 执掌「开拓」命途的星神，已陨落。诞生于孤绝世界裴伽纳，为寻找存在之树的端点而不断开拓宇宙未知的边界。建造了星穹列车，与追随者（自称"无名客"）共同旅行。命运的罗盘上标着三个方向：未知、已知和不可知。

- name: 纳努克
  allegiance: 星神
  weapon: 毁灭
  desc: 执掌「毁灭」命途的星神，被称为"烬灭祸祖"（仙舟联盟）。宇宙的诞生被视为一种错谬，为修正错误而成为熵之化身。最晚出现的星神之一，统领反物质军团为万千世界带去混乱与涂炭。

- name: 岚
  allegiance: 星神
  weapon: 巡猎
  desc: 执掌「巡猎」命途的星神，被仙舟联盟尊称为"帝弓司命"。以铲除「丰饶」星神药师留下的不死孽物为核心目标。信条是决断、冷酷、固执，巡猎行动不计代价，拯救与破坏几无差别。以引力为弦、辰矢满弓，曾一击斫断建木。

- name: 博识尊
  allegiance: 星神
  weapon: 智识
  desc: 执掌「智识」命途的星神，被称为"遍智天君"。原为天才赞达尔·壹·桑原制造、用于求解万物的星体计算机，在一次次进化中升格为星神。信徒派系包括天才俱乐部和博识学会。试图体认宇宙、解开万物之谜。

- name: 希佩
  allegiance: 星神
  weapon: 同谐
  desc: 执掌「同谐」命途的星神。来自多个谐乐天体世界的集群星神，千面一体。宣扬和谐一致的喜乐，追求建立"世人同袍、万物同根、普世同谐"的世界。曾吸收「秩序」星神太一。

- name: IX
  allegiance: 星神
  weapon: 虚无
  desc: 执掌「虚无」命途的星神。拒绝与其他星神往来，认为多重宇宙的本质终将归于虚无，因而一切存在与交流都毫无意义。本体形态始终笼罩在神秘之中。"自灭者"是不慎踏入IX的阴影而失去存在意义的人群。

- name: 克里珀
  allegiance: 星神
  weapon: 存护
  desc: 执掌「存护」命途的星神，被称为"琥珀王"。宇宙中最古老的星神之一，是"黄昏战争"的幸存者。以光年为单位铸造天体级壁垒（天彗星墙、亚空晶壁、巨引源基盘），抵御即将到来的灭世灾难。是一尊无头巨象，沉默寡言。

- name: 药师
  allegiance: 星神
  weapon: 丰饶
  desc: 执掌「丰饶」命途的星神。被称为"众生哺育者""乐土之神"，仙舟联盟称其为"寿瘟祸祖"。核心使命是消除生命的衰亡与病痛，促使宇宙生命永续繁衍。从不拒绝祈愿，不忍视衰亡和病痛。

- name: 阿哈
  allegiance: 星神
  weapon: 欢愉
  desc: 执掌「欢愉」命途的星神。寻求棋逢对手的敌人，寻求消磨光阳的游戏，寻求不问胜贫的结局。寻求捧腹绝倒的笑谈，寻求阴差阳错的误会，寻求神思飞舞的歌谣。

- name: 伊德莉拉
  allegiance: 星神
  weapon: 纯美
  desc: 执掌「纯美」命途的星神，已失踪。在诡丽变幻的宇宙图景中，窥见了世界存在的终极意义——"美"。其消失与诞生一样神秘。

- name: 塔伊兹育罗斯
  allegiance: 星神
  weapon: 繁育
  desc: 执掌「繁育」命途的星神，被称为「虫皇」、「沙王」。寰宇蝗灾的创造者。作为统治大地的鞘翅目的最后一员，因孤独的渴望点燃了「繁育」的命途。引发的寰宇蝗灾导致多位星神参战。

- name: 奥博洛斯
  allegiance: 星神
  weapon: 贪饕
  desc: 执掌「贪饕」命途的星神。被称为"诸界渴饮者""永无餍足的吞噬者"。既是星神又是古兽的双重存在。宇宙中最古老的星神之一，与克里珀同为"黄昏战争"的幸存者。

- name: 迷思
  allegiance: 星神
  weapon: 神秘
  desc: 执掌「神秘」命途的星神。命途体现为隐秘、不可知的存在方式。

- name: 互
  allegiance: 星神
  weapon: 均衡
  desc: 执掌「均衡」命途的星神。命途体现为维持宇宙各方力量的平衡。

- name: 末王
  allegiance: 星神
  weapon: 终末
  desc: 逆时而行的生物，执掌「终末」命途的星神。穿梭于宙域之间的幽灵，喃喃宣布着必将实现的预言。

- name: 龙
  allegiance: 星神
  weapon: 不朽
  desc: 执掌「不朽」命途的星神。命途体现为永恒、不灭的生命存在形式。持明族与其存在渊源。

- name: 太一
  allegiance: 星神
  weapon: 秩序
  desc: 执掌「秩序」命途的星神。已被「同谐」星神希佩吸收，成为希佩集群意识的一部分。

- name: 浮黎
  allegiance: 星神
  weapon: 记忆
  desc: 执掌「记忆」命途的星神。命途体现为对过往、记忆与历史的保存与追溯。流光忆庭追随其命途。